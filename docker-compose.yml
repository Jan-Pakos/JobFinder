

services:

  mongo:
    image: mongo:4.0.10
    restart: always
    env_file:
      - .env
    volumes:
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8084:8083"
    env_file:
      - .env
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${ME_CONFIG_MONGODB_ADMINUSERNAME}:${ME_CONFIG_MONGODB_ADMINPASSWORD}@mongo:27017/

  redis:
    image: redis
    ports:
      - "${REDIS_HOST_PORT}:6379"
    restart: always

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8082:8081"

  jobfinder:
    container_name: jobfinderAPI
    build: .
    image: ${JOBFINDER_IMAGE}
    restart: always
    ports:
      - '${JOBFINDER_PORT}:8080'
    env_file:
      - .env
